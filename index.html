<html lang="en" class=""><head><script>window.livecodes = window.livecodes || {};</script><title>Blank Project</title><meta name="title" content="Blank Project"><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js" async=""></script><script type="importmap">{

}</script></head><body>

  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <script crossorigin="" src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin="" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
          "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans",
          "Helvetica Neue", sans-serif;
        background: linear-gradient(
          135deg,
          #0f172a 0%,
          #1e293b 50%,
          #0f172a 100%
        );
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      #root {
        width: 100%;
        max-width: 800px;
      }

      .container {
        width: 100%;
      }

      .header {
        text-align: center;
        margin-bottom: 40px;
        animation: slideDown 0.6s ease-out;
      }

      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .header h1 {
        font-size: 3.5rem;
        font-weight: 800;
        background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 10px;
        letter-spacing: -1px;
      }

      .header p {
        font-size: 1.1rem;
        color: #94a3b8;
        font-weight: 500;
      }

      .timers-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-bottom: 30px;
        animation: fadeIn 0.8s ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .timer-card {
        background: rgba(30, 41, 59, 0.5);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 24px;
        padding: 32px;
        transition: all 0.3s ease;
        animation: scaleIn 0.5s ease-out;
      }

      @keyframes scaleIn {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .timer-card:hover {
        border-color: rgba(148, 163, 184, 0.4);
        background: rgba(30, 41, 59, 0.7);
      }

      .timer-name {
        font-size: 1.5rem;
        font-weight: 700;
        color: #f1f5f9;
        background: transparent;
        border: none;
        border-bottom: 2px solid transparent;
        width: 100%;
        padding: 8px 0;
        margin-bottom: 24px;
        cursor: text;
        transition: border-color 0.3s ease;
      }

      .timer-name:hover {
        border-bottom-color: rgba(148, 163, 184, 0.3);
      }

      .timer-name:focus {
        outline: none;
        border-bottom-color: #06b6d4;
      }

      .time-display {
        text-align: center;
        margin-bottom: 32px;
      }

      .time-value {
        font-size: 4.5rem;
        font-weight: 900;
        font-family: "Courier New", monospace;
        letter-spacing: 8px;
        color: #cbd5e1;
        transition: color 0.3s ease;
      }

      .time-value.active {
        color: #06b6d4;
        text-shadow: 0 0 20px rgba(6, 182, 212, 0.5);
      }

      .controls-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 24px;
      }

      .time-control {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .time-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #64748b;
        font-weight: 700;
        margin-bottom: 12px;
      }

      .time-input-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .time-btn {
        width: 36px;
        height: 36px;
        border: none;
        background: #475569;
        color: #cbd5e1;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        font-weight: 600;
      }

      .time-btn:hover:not(:disabled) {
        background: #64748b;
        transform: scale(1.05);
      }

      .time-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .time-input {
        width: 60px;
        text-align: center;
        background: #475569;
        color: #f1f5f9;
        border: none;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 1.2rem;
        font-weight: 700;
        transition: all 0.2s ease;
      }

      .time-input:hover:not(:disabled) {
        background: #64748b;
      }

      .time-input:focus:not(:disabled) {
        outline: none;
        background: #64748b;
        box-shadow: 0 0 0 2px #06b6d4;
      }

      .time-input:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .progress-bar {
        width: 100%;
        height: 3px;
        background: rgba(71, 85, 105, 0.3);
        border-radius: 999px;
        margin-bottom: 24px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #06b6d4 0%, #3b82f6 100%);
        border-radius: 999px;
        transition: width 0.3s ease;
      }

      .buttons {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      button {
        font-family: inherit;
        font-weight: 600;
        border: none;
        border-radius: 10px;
        padding: 12px 24px;
        cursor: pointer;
        transition: all 0.2s ease;
        font-size: 0.95rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        white-space: nowrap;
      }

      .btn-start {
        background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
        color: white;
        flex: 1;
        min-width: 120px;
      }

      .btn-start:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(6, 182, 212, 0.3);
      }

      .btn-pause {
        background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
        color: white;
        flex: 1;
        min-width: 120px;
      }

      .btn-pause:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(249, 115, 22, 0.3);
      }

      .btn-reset {
        background: #475569;
        color: #cbd5e1;
        flex: 1;
        min-width: 120px;
      }

      .btn-reset:hover {
        background: #64748b;
        transform: translateY(-2px);
      }

      .btn-delete {
        background: rgba(239, 68, 68, 0.2);
        color: #fca5a5;
        flex: 1;
        min-width: 120px;
      }

      .btn-delete:hover {
        background: rgba(239, 68, 68, 0.3);
        transform: translateY(-2px);
      }

      .add-timer-btn {
        width: 100%;
        padding: 16px;
        font-size: 1.05rem;
        background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
        color: white;
        font-weight: 700;
        letter-spacing: 0.5px;
        animation: slideUp 0.6s ease-out;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .add-timer-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 24px rgba(6, 182, 212, 0.3);
      }

      .add-timer-btn:active {
        transform: translateY(-1px);
      }

      @media (max-width: 600px) {
        .header h1 {
          font-size: 2.5rem;
        }

        .timer-card {
          padding: 24px;
        }

        .time-value {
          font-size: 3.5rem;
          letter-spacing: 4px;
        }

        .controls-grid {
          gap: 12px;
        }

        .buttons {
          gap: 8px;
        }

        button {
          padding: 10px 16px;
          font-size: 0.85rem;
        }
      }

      /* Icon styles */
      .icon {
        width: 18px;
        height: 18px;
        display: inline-block;
      }
    </style>
  
  
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      function CountdownTimer() {
        const [timeLeft, setTimeLeft] = useState({
          days: 0,
          hours: 0,
          minutes: 0,
          seconds: 0,
          isActive: true,
        });

        // Calculate time to May 4th, 2026
        useEffect(() => {
          const updateCountdown = () => {
            const now = new Date();
            const targetDate = new Date(2026, 4, 4, 0, 0, 0); // May 4, 2026 at midnight
            const difference = targetDate - now;

            if (difference <= 0) {
              playSound();
              setTimeLeft({
                days: 0,
                hours: 0,
                minutes: 0,
                seconds: 0,
                isActive: false,
              });
              return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((difference / 1000 / 60) % 60);
            const seconds = Math.floor((difference / 1000) % 60);

            setTimeLeft({
              days,
              hours,
              minutes,
              seconds,
              isActive: true,
            });
          };

          updateCountdown();
          const interval = setInterval(updateCountdown, 1000);
          return () => clearInterval(interval);
        }, []);

        const playSound = () => {
          try {
            const audioContext = new (window.AudioContext ||
              window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = 800;
            oscillator.type = "sine";

            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(
              0.01,
              audioContext.currentTime + 0.5,
            );

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
          } catch (e) {
            console.log("Audio context not available");
          }
        };

        const formatTime = (value) => {
          return String(value).padStart(2, "0");
        };

        return (
          <div className="container">
            <div className="header">
              <h1>May 4th</h1>
              <p>Countdown to the big day</p>
            </div>

            <div className="timers-container">
              <div className="timer-card">
                <div style={{ textAlign: "center", marginBottom: "40px" }}>
                  <div
                    style={{
                      fontSize: "0.9rem",
                      color: "#94a3b8",
                      marginBottom: "16px",
                      letterSpacing: "2px",
                      textTransform: "uppercase",
                      fontWeight: "600",
                    }}
                  >
                    Time Remaining
                  </div>
                  <div
                    style={{
                      display: "grid",
                      gridTemplateColumns: "repeat(4, 1fr)",
                      gap: "16px",
                    }}
                  >
                    <div style={{ textAlign: "center" }}>
                      <div
                        style={{
                          fontSize: "3.5rem",
                          fontWeight: "900",
                          color: "#06b6d4",
                          fontFamily: "Courier New, monospace",
                          marginBottom: "8px",
                          textShadow: "0 0 20px rgba(6, 182, 212, 0.5)",
                        }}
                      >
                        {formatTime(timeLeft.days)}
                      </div>
                      <div
                        style={{
                          fontSize: "0.75rem",
                          color: "#64748b",
                          textTransform: "uppercase",
                          letterSpacing: "1px",
                          fontWeight: "700",
                        }}
                      >
                        Days
                      </div>
                    </div>

                    <div style={{ textAlign: "center" }}>
                      <div
                        style={{
                          fontSize: "3.5rem",
                          fontWeight: "900",
                          color: "#06b6d4",
                          fontFamily: "Courier New, monospace",
                          marginBottom: "8px",
                          textShadow: "0 0 20px rgba(6, 182, 212, 0.5)",
                        }}
                      >
                        {formatTime(timeLeft.hours)}
                      </div>
                      <div
                        style={{
                          fontSize: "0.75rem",
                          color: "#64748b",
                          textTransform: "uppercase",
                          letterSpacing: "1px",
                          fontWeight: "700",
                        }}
                      >
                        Hours
                      </div>
                    </div>

                    <div style={{ textAlign: "center" }}>
                      <div
                        style={{
                          fontSize: "3.5rem",
                          fontWeight: "900",
                          color: "#06b6d4",
                          fontFamily: "Courier New, monospace",
                          marginBottom: "8px",
                          textShadow: "0 0 20px rgba(6, 182, 212, 0.5)",
                        }}
                      >
                        {formatTime(timeLeft.minutes)}
                      </div>
                      <div
                        style={{
                          fontSize: "0.75rem",
                          color: "#64748b",
                          textTransform: "uppercase",
                          letterSpacing: "1px",
                          fontWeight: "700",
                        }}
                      >
                        Minutes
                      </div>
                    </div>

                    <div style={{ textAlign: "center" }}>
                      <div
                        style={{
                          fontSize: "3.5rem",
                          fontWeight: "900",
                          color: "#06b6d4",
                          fontFamily: "Courier New, monospace",
                          marginBottom: "8px",
                          textShadow: "0 0 20px rgba(6, 182, 212, 0.5)",
                        }}
                      >
                        {formatTime(timeLeft.seconds)}
                      </div>
                      <div
                        style={{
                          fontSize: "0.75rem",
                          color: "#64748b",
                          textTransform: "uppercase",
                          letterSpacing: "1px",
                          fontWeight: "700",
                        }}
                      >
                        Seconds
                      </div>
                    </div>
                  </div>
                </div>

                <div className="progress-bar">
                  <div
                    className="progress-fill"
                    style={{ width: timeLeft.isActive ? "100%" : "0%" }}
                  ></div>
                </div>

                <div
                  style={{
                    textAlign: "center",
                    padding: "24px",
                    background: "rgba(6, 182, 212, 0.1)",
                    borderRadius: "12px",
                    marginBottom: "0",
                  }}
                >
                  <p
                    style={{
                      color: "#cbd5e1",
                      fontSize: "1.1rem",
                      fontWeight: "500",
                      margin: "0",
                    }}
                  >
                    Monday, May 4th, 2026
                  </p>
                </div>
              </div>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<CountdownTimer />);
    </script>
  

<script src="./script.js"></script></body></html>
